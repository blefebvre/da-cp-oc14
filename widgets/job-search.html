<form class="job-search-form" role="search" method="get" action="https://www.jobs.atlascopcogroup.com/search/" target="_self">
  <div class="job-search-field job-search-keyword">
    <label class="job-search-label" for="job-search-q">Search by keyword</label>
    <input id="job-search-q" type="search" name="q" placeholder="Search by keyword" autocomplete="off">
  </div>
  <div class="job-search-field job-search-location">
    <label class="job-search-label" for="job-search-location">Search by location</label>
    <input id="job-search-location" type="text" name="locationsearch" placeholder="Search by location" autocomplete="off">
  </div>
  <input type="hidden" name="locale" value="en_US">
  <input type="hidden" name="searchResultView" value="LIST">
  <input type="hidden" name="facetFilters" value="">
  <input type="hidden" name="pageNumber" value="0">
  <button type="submit" class="button primary job-search-submit">Search jobs</button>
</form>
